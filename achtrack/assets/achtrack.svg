<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343B"/>
      <stop offset="0.55" stop-color="#232329"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- userSpaceOnUse: the stem and base are straight lines, and a bounding-box gradient on a
         zero-width/height shape isn't rendered at all by spec-following renderers. -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="340" y1="280" x2="700" y2="800">
      <stop offset="0" stop-color="#F6BE72"/>
      <stop offset="0.5" stop-color="#E0913C"/>
      <stop offset="1" stop-color="#C2762B"/>
    </linearGradient>
  </defs>

  <!-- macOS leaves a margin around the tile, and the corners stay transparent -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <g fill="none" stroke="url(#metal)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup -->
    <path d="M378 312h268v108c0 104-60 164-134 164s-134-60-134-164z"/>
    <!-- handles: smooth arcs off the rim, not hooks -->
    <path d="M378 356c-52 0-74 34-62 74 9 30 34 48 62 54"/>
    <path d="M646 356c52 0 74 34 62 74-9 30-34 48-62 54"/>
    <!-- stem and base -->
    <path d="M512 584v104"/>
    <path d="M414 724h196"/>
  </g>
</svg>
